<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><defs><filter id="s" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111827" flood-opacity=".16"/></filter><clipPath id="clip"><rect x="66" y="58" width="1068" height="664" rx="13"/></clipPath></defs><rect x="0" y="0" width="1200" height="780" rx="0" fill="#e8e7f3" /><rect x="66" y="58" width="1068" height="664" rx="13" fill="#fff" filter="url(#s)"/><g clip-path="url(#clip)"><rect x="66" y="58" width="1068" height="48" rx="0" fill="#1b2030" /><circle cx="98" cy="81" r="6" fill="#fc6b72"/><circle cx="119" cy="81" r="6" fill="#ffca5b"/><circle cx="140" cy="81" r="6" fill="#57c78d"/><rect x="430" y="69" width="336" height="24" rx="6" fill="#30374b" /><text x="538" y="86" fill="#c1c8d8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" >studio.assistant</text><path d="M66 106 L1134 106" fill="none" stroke="#31394d" stroke-width="1"/><rect x="66" y="106" width="254" height="616" rx="0" fill="#1d2336" /><text x="100" y="158" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" >arc / ai</text><rect x="92" y="193" width="201" height="44" rx="8" fill="#333b52" /><text x="116" y="222" fill="#e4e8f4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" >＋   New conversation</text><text x="103" y="282" fill="#91a0b8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" >YOUR SPACE</text><rect x="93" y="301" width="211" height="44" rx="7" fill="#303952" /><text x="110" y="329" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" >✧  Launch planning</text><text x="111" y="385" fill="#a9b5ca" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" >◫   Content direction</text><text x="111" y="438" fill="#a9b5ca" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" >▤   Weekly summary</text><text x="111" y="650" fill="#8f9db5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" >Settings &amp; preferences</text><rect x="320" y="106" width="814" height="616" rx="0" fill="#fafafe" /><text x="365" y="154" fill="#232942" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" >Launch planning</text><text x="1039" y="154" fill="#9ba3b3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" >•••</text><path d="M320 174 L1134 174" fill="none" stroke="#e7e8f0" stroke-width="1"/><circle cx="414" cy="261" r="21" fill="#d8d3f7"/><text x="406" y="269" fill="#5148aa" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" >A</text><rect x="450" y="217" width="601" height="74" rx="12" fill="#ecebf6" /><text x="474" y="249" fill="#45445a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="650" >Help me structure a product launch plan</text><text x="474" y="273" fill="#7b7c92" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" >for a small software studio.</text><circle cx="414" cy="354" r="21" fill="#5447bb"/><text x="408" y="361" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" >✦</text><text x="455" y="343" fill="#292e44" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" >Absolutely. Here's a practical starting point.</text><text x="455" y="375" fill="#677188" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" >We'll break the launch into three focused phases:</text><rect x="455" y="408" width="570" height="46" rx="9" fill="#fff" stroke="#e5e7ef"/><circle cx="479" cy="431" r="12" fill="#dfe8ff"/><text x="510" y="438" fill="#424960" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="650" >01  Validate the offer and positioning</text><rect x="455" y="469" width="570" height="46" rx="9" fill="#fff" stroke="#e5e7ef"/><circle cx="479" cy="492" r="12" fill="#dff3ed"/><text x="510" y="499" fill="#424960" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="650" >02  Prepare demos and documentation</text><rect x="455" y="530" width="570" height="46" rx="9" fill="#fff" stroke="#e5e7ef"/><circle cx="479" cy="553" r="12" fill="#f5e6e2"/><text x="510" y="560" fill="#424960" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="650" >03  Publish and collect feedback</text><rect x="390" y="628" width="684" height="59" rx="12" fill="#fff" stroke="#dfe2eb"/><text x="419" y="665" fill="#9aa1b1" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" >Ask a follow-up question...</text><circle cx="1043" cy="658" r="20" fill="#5447bb"/><text x="1037" y="665" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" >↑</text></g></svg>